# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    photos_directory: '%kernel.project_dir%/public/uploads/photos'
    app.email_from: 'zbierame@hribiky.sk'
    app.email_from_name: 'Hríbiky.sk'
    app.email_to_me: 'petiar@gmail.com'
    ios_api_key: '%env(IOS_API_KEY)%'
    anthropic_api_key: '%env(ANTHROPIC_API_KEY)%'
    # Nominatim (OpenStreetMap) — obec, okres, kraj hríbika. User-Agent musí identifikovať aplikáciu;
    # kontakt sa dá doplniť na serveri v .env.local (NOMINATIM_USER_AGENT=…).
    env(NOMINATIM_USER_AGENT): 'Hribiky.sk/1.0 (+https://hribiky.sk)'
    env(NOMINATIM_URL): 'https://nominatim.openstreetmap.org/reverse'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    App\Service\BlogPostGeneratorService:
        arguments:
            $apiKey: '%anthropic_api_key%'
    App\Service\MushroomDescriptionScorerService:
        arguments:
            $apiKey: '%anthropic_api_key%'
    App\Service\FotoUploader:
        arguments:
            $uploadDir: '%photos_directory%'
    App\Service\ThumbnailService:
        arguments:
            $uploadDir: '%photos_directory%'
    App\Controller\MushroomController:
        arguments:
            $uploadDir: '%photos_directory%'
    App\Service\MailService:
        arguments:
            $logger: '@logger'
            $emailFrom: '%app.email_from%'
            $emailFromName: '%app.email_from_name%'
            $emailToMe: '%app.email_to_me%'
    App\EventListener\ApiKeyListener:
        tags:
            - { name: kernel.event_listener, event: kernel.request, priority: 10 }
        arguments:
            $iosApiKey: '%ios_api_key%'
    App\EventListener\EntityCreateLogger:
        tags:
            - { name: doctrine.event_listener, event: postPersist }
    App\EventListener\BlacklistRequestListener:
        tags:
            - { name: kernel.event_listener, event: kernel.request, priority: 255 }
    App\Command\FetchTimelapseCommand:
        arguments:
            $projectDir: '%kernel.project_dir%'

when@test:
    parameters:
        # Testy nesmú zapisovať do skutočného public/uploads.
        photos_directory: '%kernel.project_dir%/var/test-uploads/photos'
