monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event"]
            # uncomment to get logging in your browser
            # you may have to allow bigger header sizes in your Web server configuration
            #firephp:
            #    type: firephp
            #    level: info
            #chromephp:
            #    type: chromephp
            #    level: info
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: error
                channels: ["!event"]
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
            # Kritická chyba (napr. 500 pre celý web) → e-mail. Tá istá chyba najviac raz za hodinu.
            # Pamäť deduplikácie je v logs/, nie v cache/ — deploy cache maže.
            error_mail:
                type: deduplication
                handler: error_mail_sender
                level: critical
                # Doplniť hodnoty do textu ({message}, {class}…) PRED porovnaním — inak by všetky
                # chyby vyzerali rovnako a za hodinu by prišiel len jeden e-mail.
                process_psr_3_messages: true
                deduplication_level: critical
                time: 3600
                store: '%kernel.logs_dir%/monolog_dedup_critical'
            error_mail_sender:
                type: symfony_mailer
                nested: true
                from_email: '%app.email_from%'
                to_email: '%app.email_to_me%'
                subject: 'Hríbiky.sk: kritická chyba na produkcii'
                level: critical
                formatter: monolog.formatter.html
                content_type: text/html
