name: Deploy

on:
  push:
    branches:
      - main

jobs:
  # Testy sú v tests.yml, aby rovnaké testy bežali aj pri pull requestoch.
  test:
    uses: ./.github/workflows/tests.yml

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Deploy na server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # Pri chybe sa deploy zastaví a v GitHub Actions bude červený
            # (predtým pokračoval ďalej a web mohol skončiť napoly aktualizovaný).
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git pull origin main
            composer install --no-dev --optimize-autoloader --no-interaction
            php bin/console cache:clear
            php bin/console doctrine:migrations:migrate --no-interaction
            php bin/console assets:install public
            # JavaScript/CSS z assets/ (AssetMapper, Stimulus, Turbo) — na produkcii sa musia skompilovať
            # do public/assets, inak vracajú 404.
            php bin/console asset-map:compile
            # PHP-FPM drží v pamäti (opcache) staré verzie súborov a zmeny nekontroluje — po update
            # balíkov to zhodilo celý web. Jednorazový skript s náhodným názvom opcache vyčistí.
            RESET="opcache-reset-$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n').php"
            echo '<?php if (function_exists("opcache_reset")) { opcache_reset(); } echo "ok";' > "public/$RESET"
            # hribiky.sk aj hribiky.cz bežia v samostatných PHP procesoch, každý má vlastnú opcache.
            for DOMAIN in hribiky.sk hribiky.cz; do
              curl -fsS --max-time 30 "https://$DOMAIN/$RESET" || echo "Upozornenie: opcache na $DOMAIN sa nepodarilo vyčistiť"
              echo " ($DOMAIN)"
            done
            rm -f "public/$RESET"
            # Kontrola po nasadení: hlavná stránka a API musia odpovedať 200. Inak deploy skončí
            # červeno (a vypíše koniec logu), aby sa výpadok neodhalil až náhodou.
            sleep 3
            for URL in "https://hribiky.sk/" "https://hribiky.sk/api/leaderboard" "https://hribiky.sk/blog" "https://hribiky.cz/" "https://hribiky.cz/blog"; do
              CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$URL" || echo "000")
              echo "$URL -> $CODE"
              if [ "$CODE" != "200" ]; then
                echo "CHYBA: web po nasadení neodpovedá správne ($URL vrátil $CODE). Koniec var/log/prod.log:"
                tail -n 30 var/log/prod.log || true
                exit 1
              fi
            done