name: Deploy

on:
  push:
    branches:
      - main

jobs:
  # Testy sú v tests.yml, aby rovnaké testy bežali aj pri pull requestoch.
  test:
    uses: ./.github/workflows/tests.yml

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Deploy na server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          # Predvolene 10 min — prvé generovanie 800 px náhľadov môže trvať dlhšie.
          command_timeout: 30m
          script: |
            # Pri chybe sa deploy zastaví a v GitHub Actions bude červený
            # (predtým pokračoval ďalej a web mohol skončiť napoly aktualizovaný).
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git pull origin main
            composer install --no-dev --optimize-autoloader --no-interaction
            php bin/console cache:clear
            php bin/console doctrine:migrations:migrate --no-interaction
            php bin/console assets:install public
            # JavaScript/CSS z assets/ (AssetMapper, Stimulus, Turbo) — na produkcii sa musia skompilovať
            # do public/assets, inak vracajú 404.
            php bin/console asset-map:compile
            # Chýbajúce náhľady fotiek (800 px). Prvý beh po zmene veľkosti trvá niekoľko minút,
            # potom len skontroluje existenciu súborov. Chyba tu deploy nezastaví — web má zálohu (starší náhľad/originál).
            php bin/console app:generate-thumbnails --no-interaction --no-ansi | tail -n 3 || echo "Upozornenie: náhľady sa nepodarilo vygenerovať"
            # Websupport ukladá opcache na disk (opcache.file_cache_only=1, adresár viditeľný len pre PHP-FPM,
            # nie pre SSH) a každá doména môže bežať na inej verzii PHP s vlastnou cache (hribiky.cz je alias
            # s PHP 8.4). opcache_reset() disk nemaže — po upgrade Symfony zostal na .cz starý kód a vracala 500.
            # Preto cache zmaže PHP skript spustený cez každú doménu (= v jej PHP procese).
            RESET="opcache-clear-$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n').php"
            cat > "public/$RESET" <<'PHP'
            <?php
            $d = ini_get('opcache.file_cache'); $n = 0; $e = 0;
            if ($d && is_dir($d)) {
                $it = new RecursiveIteratorIterator(new RecursiveDirectoryIterator($d, FilesystemIterator::SKIP_DOTS), RecursiveIteratorIterator::CHILD_FIRST);
                foreach ($it as $f) { ($f->isDir() ? @rmdir($f) : @unlink($f)) ? $n++ : $e++; }
            }
            if (function_exists('opcache_reset')) { @opcache_reset(); }
            echo 'PHP ', PHP_VERSION, ', zmazanych ', $n, ', chyb ', $e;
            PHP
            for DOMAIN in hribiky.sk hribiky.cz; do
              echo "opcache $DOMAIN: $(curl -fsS --max-time 60 "https://$DOMAIN/$RESET" || echo 'nepodarilo sa vyčistiť')"
            done
            rm -f "public/$RESET"
            # Kontrola po nasadení: hlavná stránka a API musia odpovedať 200. Inak deploy skončí
            # červeno (a vypíše koniec logu), aby sa výpadok neodhalil až náhodou.
            sleep 3
            for URL in "https://hribiky.sk/" "https://hribiky.sk/api/leaderboard" "https://hribiky.sk/blog" "https://hribiky.cz/" "https://hribiky.cz/blog"; do
              CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$URL" || echo "000")
              echo "$URL -> $CODE"
              if [ "$CODE" != "200" ]; then
                echo "CHYBA: web po nasadení neodpovedá správne ($URL vrátil $CODE). Koniec var/log/prod.log:"
                tail -n 30 var/log/prod.log || true
                exit 1
              fi
            done